name: cancanworld

services:
  cancanworld:
    # Compose 直接从发布包构建镜像，不再依赖额外安装脚本。
    image: ${CANCANWORLD_IMAGE:-cancanworld:latest}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        APP_VERSION: ${CANCANWORLD_VERSION:-development}
    restart: unless-stopped
    ports:
      - "${CANCANWORLD_PORT:-3080}:3080"
    env_file:
      # 发布包根目录的 .env 同时用于 Compose 插值和应用配置注入。
      - ./.env
    environment:
      # 后端端口仅供同容器 Nginx 使用，不直接映射到宿主机。
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 3081
      NODE_ENV: production
    extra_hosts:
      # 外部 MySQL 位于 Docker 宿主机时可使用 host.docker.internal。
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3080/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 4
