server {
    # HTTP 入口可由部署者继续接入 Certbot 或上游 TLS 代理。
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Vue 构建产物随 current 版本软链接原子切换。
    root __INSTALL_DIR__/current/public;
    index index.html;
    client_max_body_size 11m;

    location /api/ {
        # 保留 /api 原路径转发到仅监听本机的 Bun 后端。
        proxy_pass http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        # Vite 指纹资源可长期缓存，文件名变化时自然失效。
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Vue history 路由回退到入口文件。
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        # 禁止访问隐藏配置和元数据文件。
        deny all;
    }

    # 基础响应头降低 MIME 猜测与来源泄漏。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
